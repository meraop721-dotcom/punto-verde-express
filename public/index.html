
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5b36">
<title>Punto Verde Express</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--green:#0b5b36;--green2:#117348;--gold:#f0a52b;--cream:#f7f5ee;--ink:#173b29;--muted:#66756d;--line:#e5e9e4;--white:#fff;--shadow:0 10px 30px rgba(17,55,38,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
a{text-decoration:none;color:inherit}.wrap{max-width:980px;margin:auto}
.top{background:linear-gradient(135deg,#073e25,#0b5b36 65%,#167448);color:#fff;padding:18px 18px 26px;border-radius:0 0 28px 28px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px}.brand{display:flex;gap:11px;align-items:center}.mark{width:46px;height:46px;border-radius:15px;background:var(--gold);display:grid;place-items:center;font-size:25px}.brand h1{margin:0;font-size:21px}.brand span{font-size:12px;color:#d8efdf}.mode{border:1px solid #ffffff30;background:#ffffff14;color:#fff;border-radius:13px;padding:10px 12px;font-weight:800}
main{padding:18px}.hero h2{font-size:30px;line-height:1.08;margin:22px 0 6px}.hero p{margin:0;color:#dceee2}.days{display:flex;gap:8px;overflow:auto;margin:18px 0 5px}.day{border:1px solid var(--line);background:#fff;border-radius:13px;padding:10px 14px;font-weight:800;white-space:nowrap}.day.active{background:var(--green);border-color:var(--green);color:#fff}
.card{background:#fff;border:1px solid #e8ece7;border-radius:22px;padding:18px;box-shadow:var(--shadow);margin-top:14px}.menu-title{display:flex;justify-content:space-between;gap:12px}.menu-title h3{margin:0 0 3px}.muted{color:var(--muted)}.price{background:#edf7ef;color:var(--green);padding:7px 10px;border-radius:10px;font-weight:900}.label{font-size:12px;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.06em;margin-top:17px}.food{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:900;cursor:pointer}.primary{background:var(--green);color:#fff}.gold{background:var(--gold);color:var(--ink)}.special{border:2px solid #f0b039}.features{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.feature{padding:15px;background:#fff;border:1px solid var(--line);border-radius:17px}.feature strong{display:block;margin:5px 0}.feature p{margin:0;color:var(--muted);font-size:13px;line-height:1.45}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;padding:15px;align-items:end}.modal.show{display:flex}.sheet{width:100%;max-width:720px;margin:auto;background:#fff;border-radius:25px 25px 0 0;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px;background:#fff}.summary{background:#f5f8f5;border-radius:15px;padding:14px}.sumrow{display:flex;justify-content:space-between;font-weight:900}.status{margin-top:13px;background:#eef7f0;border:1px solid #d7e9dc;border-radius:16px;padding:14px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.step{padding:9px 6px;text-align:center;border-radius:11px;background:#edf0ed;font-size:11px;font-weight:800}.step.done{background:#cfe8d6;color:#0b5b36}.step.current{background:#0b5b36;color:#fff}
#map{height:360px;border-radius:18px;margin-top:12px;border:1px solid var(--line)}.map-note{font-size:12px;color:var(--muted);margin-top:8px}.pill{display:inline-flex;gap:6px;align-items:center;background:#edf7ef;padding:7px 10px;border-radius:999px;font-size:12px;font-weight:800}
.driver-shell{min-height:100vh;background:var(--cream)}.driver-head{background:var(--green);color:white;padding:20px}.driver-main{padding:18px;max-width:980px;margin:auto}.driver-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}.switch{background:#fff;border:1px solid var(--line);padding:14px;border-radius:15px}.switch b{display:block}.location-card{display:flex;justify-content:space-between;align-items:center;gap:10px}.gps-on{color:var(--green);font-weight:900}.gps-off{color:#a34a31;font-weight:900}
.footer{text-align:center;padding:30px 15px;color:var(--muted);font-size:12px}
.toast{position:fixed;left:50%;bottom:25px;transform:translateX(-50%);background:#173b29;color:#fff;padding:11px 15px;border-radius:13px;display:none;z-index:2000}.toast.show{display:block}
@media(max-width:700px){.features{grid-template-columns:1fr}.progress{grid-template-columns:1fr 1fr}.top{border-radius:0 0 22px 22px}}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const menus={
"Lunes":{e:["Sopa de pollo","Papa a la huancaína","Causa de pollo"],m:["Arroz con pollo","Ají de gallina","Tallarines rojos con pollo"]},
"Martes":{e:["Aguadito de pollo","Papa rellena","Ensalada rusa"],m:["Lomo saltado","Milanesa de pollo","Cau cau"]},
"Miércoles":{e:["Sopa de verduras","Ocopa","Tamal criollo"],m:["Pescado frito","Arroz chaufa de pollo","Seco de pollo"]},
"Jueves":{e:["Caldo de gallina","Causa de pollo","Papa a la huancaína"],m:["Arroz con pato","Pollo al horno","Tallarines verdes con pollo"]},
"Viernes":{e:["Chilcano de pescado","Causa de atún","Papa rellena"],m:["Seco de cabrito","Lomo saltado","Pescado sudado"]},
"Sábado":{e:[],m:[]}
};
const statusNames={received:"Recibido",accepted:"Aceptado",preparing:"Preparando",ready:"Listo",picked_up:"Recogido",on_the_way:"En camino",delivered:"Entregado",cancelled:"Cancelado"};
let current = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()-1] || "Lunes";
let clientSocket=null, driverSocket=null, driverWatch=null, driverMap=null, customerMap=null, driverMarker=null;
const savedOrder = localStorage.getItem("pvx_order");
function toast(msg){const x=document.getElementById("toast");x.textContent=msg;x.classList.add("show");setTimeout(()=>x.classList.remove("show"),2200)}
function dayButtons(){return Object.keys(menus).map(d=>`<button class="day ${d===current?"active":""}" onclick="selectDay('${d}')">${d}</button>`).join("")}
function menuHtml(){
 const x=menus[current];
 if(current==="Sábado") return `<div class="card special"><h3>🔥 Especial de sábado</h3><p class="muted">Parrillas únicamente. La composición y el precio se comunicarán semanalmente.</p><button class="btn gold" onclick="openOrder(true)">Consultar / reservar parrilla</button></div>`;
 return `<div class="card"><div class="menu-title"><div><h3>Menú del ${current}</h3><span class="muted">Menú casero y criollo</span></div><div class="price">S/12</div></div>
 <div class="label">Entradas</div>${x.e.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}
 <div class="label">Segundos</div>${x.m.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}
 <button class="btn primary" style="margin-top:14px" onclick="openOrder(false)">🛒 Elegir este menú</button></div>`;
}
function customerUI(){
 document.getElementById("app").innerHTML=`
 <header class="top"><div class="wrap"><div class="topbar"><div class="brand"><div class="mark">🍽️</div><div><h1>Punto Verde Express</h1><span>Menús & Parrillas</span></div></div><button class="mode" onclick="goDriver()">🛵 Repartidor</button></div>
 <div class="hero"><h2>Tu menú de la semana,<br>tu parrilla del sábado.</h2><p>Consulta antes de pedir y sigue tu entrega en tiempo real.</p></div></div></header>
 <main class="wrap"><div class="days">${dayButtons()}</div><section id="menu">${menuHtml()}</section>
 <div class="features"><div class="feature">📲<strong>Pedido anticipado</strong><p>Consulta el menú y confirma tu almuerzo.</p></div><div class="feature">🛵<strong>Delivery</strong><p>S/3 Guadalupe · S/5 Chepén (referencial).</p></div><div class="feature">🏪<strong>Recojo</strong><p>También puedes recoger tu pedido.</p></div></div>
 <section class="card"><h3>📦 Seguimiento de pedido</h3><div id="tracking">${savedOrder ? `<button class="btn primary" onclick="loadTracking()">Ver mi pedido ${JSON.parse(savedOrder).id}</button>` : '<p class="muted">Cuando hagas un pedido, aparecerá aquí el seguimiento.</p>'}</div></section></main><div class="footer">Punto Verde Express · Guadalupe y Chepén</div>`;
}
function selectDay(d){current=d;customerUI()}
function openOrder(parrilla){
 const x=menus[current];
 const modal=document.createElement("div"); modal.className="modal show"; modal.id="orderModal";
 modal.innerHTML=`<div class="sheet"><button class="close" onclick="closeOrder()">✕</button><h2>🛒 ${parrilla?"Reserva de parrilla":"Tu pedido"}</h2>
 ${parrilla ? '<div class="status"><b>🔥 Parrilla del sábado</b><br><span class="muted">Composición y precio se comunicarán semanalmente.</span></div>' : `
 <div class="field"><label>Tu nombre</label><input id="cname" placeholder="Nombre"></div>
 <div class="field"><label>Entrada</label><select id="entry">${x.e.map(v=>`<option>${v}</option>`).join("")}</select></div>
 <div class="field"><label>Segundo</label><select id="mainDish">${x.m.map(v=>`<option>${v}</option>`).join("")}</select></div>`}
 <div class="field"><label>Modalidad</label><select id="delivery"><option value="delivery">🛵 Delivery</option><option value="pickup">🏪 Recojo</option></select></div>
 <div class="field"><label>Zona</label><select id="zone"><option>Guadalupe</option><option>Chepén</option></select></div>
 <div class="field"><label>Hora aproximada</label><input id="time" type="time"></div>
 <div class="summary"><div class="sumrow"><span>Total referencial</span><span>S/<span id="total">12.00</span></span></div><small class="muted">Delivery: S/3 Guadalupe / S/5 Chepén. Tarifas referenciales.</small></div>
 <button class="btn primary" style="margin-top:12px" onclick="submitOrder(${parrilla})">Confirmar pedido</button></div>`;
 document.body.appendChild(modal);
 document.getElementById("delivery").onchange=updateTotal;document.getElementById("zone").onchange=updateTotal;updateTotal();
}
function updateTotal(){const d=document.getElementById("delivery")?.value,z=document.getElementById("zone")?.value;if(!d)return;document.getElementById("total").textContent=(12+(d==="delivery"?(z==="Guadalupe"?3:5):0)).toFixed(2)}
function closeOrder(){document.getElementById("orderModal")?.remove()}
async function submitOrder(parrilla){
 const d=document.getElementById("delivery").value,z=document.getElementById("zone").value;
 const body={customerName:document.getElementById("cname")?.value||"Cliente",day:current,entry:document.getElementById("entry")?.value||"Parrilla del sábado",main:document.getElementById("mainDish")?.value||"Parrilla del sábado",zone:z,delivery:d,time:document.getElementById("time").value,total:12+(d==="delivery"?(z==="Guadalupe"?3:5):0)};
 const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await r.json();
 localStorage.setItem("pvx_order",JSON.stringify(data.order));closeOrder();toast("Pedido registrado: "+data.order.id);customerUI();loadTracking();
}
async function loadTracking(){
 const saved=JSON.parse(localStorage.getItem("pvx_order")||"null");if(!saved)return;
 const r=await fetch("/api/orders/"+saved.id);if(!r.ok){toast("No se encontró el pedido");return}
 const d=await r.json();
 renderTracking(d.order,d.driverLocation);
 clientSocket ||= io();
 clientSocket.off("driver-location");clientSocket.off("order-status");
 clientSocket.emit("join-order",{orderId:d.order.id});
 clientSocket.on("driver-location",loc=>renderTracking(saved,{...loc}));
 clientSocket.on("order-status",x=>{const o={...saved,status:x.status};localStorage.setItem("pvx_order",JSON.stringify(o));renderTracking(o)});
}
function renderTracking(order,loc){
 const el=document.getElementById("tracking"); if(!el)return;
 const steps=["received","preparing","picked_up","on_the_way","delivered"];
 const idx=Math.max(0,steps.indexOf(order.status));
 const progress=steps.map((s,i)=>`<div class="step ${i<idx?"done":""} ${s===order.status?"current":""}">${statusNames[s]}</div>`).join("");
 el.innerHTML=`<div class="status"><span class="pill">📦 ${order.id}</span><h4 style="margin:10px 0 4px">${statusNames[order.status]}</h4><p class="muted" style="margin:0">${order.entry} + ${order.main}<br>${order.delivery==="delivery"?"🛵 Delivery":"🏪 Recojo"} · ${order.zone}<br>Total: <b>S/${order.total.toFixed(2)}</b></p>
 <div class="progress">${progress}</div></div>
 <div id="customerMap"></div><div class="map-note">${loc ? "📍 Ubicación del repartidor actualizada en tiempo real." : "🛵 El mapa aparecerá cuando el repartidor inicie la entrega y comparta su ubicación."}</div>`;
 if(loc) setTimeout(()=>initCustomerMap(loc,order),50);
}
function initCustomerMap(loc,order){
 const el=document.getElementById("customerMap");if(!el)return;el.innerHTML='<div id="map"></div>';
 if(customerMap)customerMap.remove();
 customerMap=L.map("map").setView([loc.lat,loc.lng],15);
 L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(customerMap);
 driverMarker=L.marker([loc.lat,loc.lng]).addTo(customerMap).bindPopup("🛵 Repartidor").openPopup();
}
function goDriver(){location.href=location.pathname+"?modo=repartidor"}
function driverUI(){
 document.getElementById("app").innerHTML=`
 <div class="driver-shell"><div class="driver-head"><div class="wrap"><div class="topbar"><div><h2 style="margin:0">🛵 Panel del repartidor</h2><small>Comparte tu GPS con el cliente en tiempo real</small></div><button class="mode" onclick="location.href=location.pathname">👤 Cliente</button></div></div></div>
 <div class="driver-main"><div class="card"><h3>Pedido</h3><div class="field"><label>Código del pedido</label><input id="driverOrder" placeholder="PV-123456" value="${savedOrder?JSON.parse(savedOrder).id:""}"></div><div class="driver-actions"><button class="btn primary" onclick="startDriver()">📍 Iniciar GPS</button><button class="btn gold" onclick="stopDriver()">⏹ Detener GPS</button></div><div class="location-card" style="margin-top:12px"><span>Estado GPS</span><span id="gpsState" class="gps-off">Desactivado</span></div></div>
 <div class="card"><h3>Estado del pedido</h3><select id="driverStatus" style="width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px"><option value="accepted">Aceptado</option><option value="preparing">Preparando</option><option value="ready">Listo</option><option value="picked_up">Pedido recogido</option><option value="on_the_way">En camino</option><option value="delivered">Entregado</option></select><button class="btn primary" style="margin-top:10px" onclick="sendStatus()">Actualizar estado</button></div>
 <div class="card"><h3>🗺️ Tu ubicación</h3><div id="driverMap"></div><p class="map-note">El GPS del teléfono debe estar activado. El navegador pedirá permiso para acceder a la ubicación.</p></div></div></div>`;
}
function startDriver(){
 const orderId=document.getElementById("driverOrder").value.trim();if(!orderId){toast("Escribe el código del pedido");return}
 if(!navigator.geolocation){toast("Este navegador no admite GPS");return}
 driverSocket ||= io();driverSocket.emit("join-order",{orderId});
 driverSocket.off("connect"); // avoid duplicate status text
 driverWatch=navigator.geolocation.watchPosition(pos=>{
   const loc={lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString()};
   document.getElementById("gpsState").textContent="Activo";document.getElementById("gpsState").className="gps-on";
   driverSocket.emit("driver-location",{orderId,...loc});updateDriverMap(loc);
 },err=>{
   document.getElementById("gpsState").textContent="Error GPS";document.getElementById("gpsState").className="gps-off";
   toast(err.code===1?"Debes permitir la ubicación en el navegador.":"No se pudo obtener la ubicación.");
 },{enableHighAccuracy:true,maximumAge:3000,timeout:10000});
 toast("GPS activado");
}
function stopDriver(){if(driverWatch!==null){navigator.geolocation.clearWatch(driverWatch);driverWatch=null}if(document.getElementById("gpsState")){document.getElementById("gpsState").textContent="Desactivado";document.getElementById("gpsState").className="gps-off"}toast("GPS detenido")}
function updateDriverMap(loc){
 if(!driverMap){driverMap=L.map("driverMap").setView([loc.lat,loc.lng],16);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(driverMap)}
 if(!driverMarker)driverMarker=L.marker([loc.lat,loc.lng]).addTo(driverMap);else driverMarker.setLatLng([loc.lat,loc.lng]);
 driverMap.setView([loc.lat,loc.lng]);
}
function sendStatus(){const orderId=document.getElementById("driverOrder").value.trim();if(!orderId){toast("Escribe el código del pedido");return}driverSocket ||= io();driverSocket.emit("driver-status",{orderId,status:document.getElementById("driverStatus").value});toast("Estado actualizado")}
if(new URLSearchParams(location.search).get("modo")==="repartidor") driverUI(); else customerUI();
</script>
</body>
</html>
