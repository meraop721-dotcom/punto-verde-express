<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5b36">
<title>Punto Verde Express</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#0b5b36;--g2:#14764a;--gold:#f0a52b;--cream:#f7f5ee;--ink:#173b29;--muted:#69766f;--line:#e2e8e1;--white:#fff;--danger:#b84932;--shadow:0 10px 28px rgba(19,57,39,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}.wrap{max-width:1040px;margin:auto}
.top{background:linear-gradient(135deg,#073e25,#0b5b36 70%,#167448);color:#fff;padding:18px;border-radius:0 0 28px 28px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;border-radius:15px;background:var(--gold);display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:21px}.brand span{font-size:12px;color:#d7efdf}.mode{border:1px solid #ffffff33;background:#ffffff14;color:#fff;padding:10px 12px;border-radius:13px;font-weight:800}
main{padding:18px}.days{display:flex;gap:8px;overflow:auto;margin:15px 0}.day{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 14px;font-weight:800;white-space:nowrap}.day.active{background:var(--g);border-color:var(--g);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow);margin:14px 0}.menu-title{display:flex;justify-content:space-between;gap:10px}.price{background:#edf7ef;color:var(--g);border-radius:10px;padding:7px 10px;font-weight:900}.label{margin-top:16px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.food{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.food:last-child{border:0}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;padding:13px 14px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#fff}.gold{background:var(--gold);color:var(--ink)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;padding:15px;align-items:end}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:720px;margin:auto;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px}.summary{background:#f5f8f5;border-radius:15px;padding:14px}.sum{display:flex;justify-content:space-between;font-weight:900}
#customerMap,#driverMap,#adminMap{height:360px;border-radius:17px;margin-top:12px}.status{background:#eef7f0;border:1px solid #d7e9dc;padding:13px;border-radius:15px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}.step{background:#edf0ed;border-radius:10px;padding:8px 5px;font-size:10px;text-align:center;font-weight:800}.step.done{background:#cfe8d6;color:var(--g)}.step.current{background:var(--g);color:#fff}
.admin-head,.driver-head{background:var(--g);color:#fff;padding:18px}.admin-main,.driver-main{padding:18px;max-width:1040px;margin:auto}.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:25px}.orders{display:grid;gap:12px}.order-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px rgba(19,57,39,.07)}.order-top{display:flex;justify-content:space-between;gap:10px}.code{font-weight:950}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:#edf7ef;color:var(--g)}.order-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;color:var(--muted);font-size:13px;margin:10px 0}.select-status{padding:10px;border:1px solid var(--line);border-radius:10px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.driver-card{background:#fff;border:1px solid var(--line);border-radius:19px;padding:15px;box-shadow:var(--shadow);margin-bottom:12px}.driver-card.selected{border:2px solid var(--g)}.driver-row{display:flex;justify-content:space-between;gap:10px;align-items:center}.gps{font-weight:950}.gps.on{color:var(--g)}.gps.off{color:var(--danger)}.assigned{border-left:4px solid var(--g);padding-left:12px}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173b29;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:2000}.toast.show{display:block}.footer{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.order-grid{grid-template-columns:1fr}.progress{grid-template-columns:1fr 1fr}.top{border-radius:0 0 22px 22px}}
</style>
</head>
<body><div id="app"></div><div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const menus={
"Lunes":{e:["Sopa de pollo","Papa a la huancaína","Causa de pollo"],m:["Arroz con pollo","Ají de gallina","Tallarines rojos con pollo"]},
"Martes":{e:["Aguadito de pollo","Papa rellena","Ensalada rusa"],m:["Lomo saltado","Milanesa de pollo","Cau cau"]},
"Miércoles":{e:["Sopa de verduras","Ocopa","Tamal criollo"],m:["Pescado frito","Arroz chaufa de pollo","Seco de pollo"]},
"Jueves":{e:["Caldo de gallina","Causa de pollo","Papa a la huancaína"],m:["Arroz con pato","Pollo al horno","Tallarines verdes con pollo"]},
"Viernes":{e:["Chilcano de pescado","Causa de atún","Papa rellena"],m:["Seco de cabrito","Lomo saltado","Pescado sudado"]},
"Sábado":{e:[],m:[]}
};
const statusNames={received:"Recibido",accepted:"Aceptado",preparing:"Preparando",ready:"Listo",picked_up:"Recogido",on_the_way:"En camino",delivered:"Entregado",cancelled:"Cancelado"};
const steps=["received","preparing","picked_up","on_the_way","delivered"];
let current=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()-1]||"Lunes";
let customerSocket=null,driverSocket=null,adminSocket=null,driverWatch=null,driverMap=null,customerMap=null,adminMap=null,driverMarker=null,customerMarker=null,adminMarker=null;
const sessionKey="pvx_staff_session";
function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)}
function staffToken(){try{return JSON.parse(sessionStorage.getItem(sessionKey)||"null")?.token||null}catch{return null}}
function staffSession(){try{return JSON.parse(sessionStorage.getItem(sessionKey)||"null")}catch{return null}}
function saveStaff(data){sessionStorage.setItem(sessionKey,JSON.stringify(data))}
function clearStaff(){sessionStorage.removeItem(sessionKey)}
async function api(url,opts={}){opts.headers={...(opts.headers||{})};const t=staffToken();if(t)opts.headers.Authorization="Bearer "+t;return fetch(url,opts)}
function logout(){const t=staffToken();if(t)fetch("/api/auth/logout",{method:"POST",headers:{Authorization:"Bearer "+t}}).catch(()=>{});clearStaff();location.href="/"}
function loginUI(role){
 const admin=role==="admin";
 document.getElementById("app").innerHTML=`<main class="wrap" style="padding:22px"><div class="card" style="max-width:500px;margin:45px auto"><div style="text-align:center"><div class="mark" style="margin:auto">${admin?"🧑‍💼":"🛵"}</div><h1>${admin?"Administración":"Acceso de repartidor"}</h1><p class="muted">Punto Verde Express · acceso privado</p></div><div class="field"><label>Usuario</label><input id="loginUser" autocomplete="username"></div><div class="field"><label>Contraseña</label><input id="loginPass" type="password" autocomplete="current-password"></div><button class="btn primary" style="width:100%;margin-top:8px" onclick="doLogin('${role}')">🔐 Ingresar</button><button class="btn" style="width:100%;margin-top:8px;background:#eef1ee" onclick="location.href='/'">← Volver al cliente</button><p id="loginMsg" class="muted" style="text-align:center;margin-top:14px"></p></div></main>`;
}
async function doLogin(role){
 const msg=document.getElementById("loginMsg");msg.textContent="Verificando...";
 const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({role,username:loginUser.value.trim(),password:loginPass.value})});
 const d=await r.json();if(!r.ok){msg.textContent=d.error||"No se pudo ingresar";return}
 saveStaff({token:d.token,role:d.role,user:d.user});location.href=role==="admin"?"?modo=admin":"?modo=repartidor";
}
function customerUI(){
 const saved=JSON.parse(localStorage.getItem("pvx_order")||"null");
 document.getElementById("app").innerHTML=`<header class="top"><div class="wrap"><div class="topbar"><div class="brand"><div class="mark">🍽️</div><div><h1>Punto Verde Express</h1><span>Menús & Parrillas</span></div></div></div><div style="margin-top:20px"><b style="font-size:28px">Tu menú de la semana,<br>tu parrilla del sábado.</b><p style="margin-bottom:0;color:#d7efdf">Guadalupe · Chepén</p></div></div></header><main class="wrap"><div class="days">${Object.keys(menus).map(d=>`<button class="day ${d===current?"active":""}" onclick="selectDay('${d}')">${d}</button>`).join("")}</div><div id="menu"></div><div class="card"><h3>📦 Seguimiento de mi pedido</h3><p class="muted" style="margin-top:-4px">Consulta el estado y, cuando el repartidor esté en camino, su ubicación GPS en tiempo real.</p><div id="tracking">${saved?`<button class="btn primary" onclick="loadTracking()">Ver pedido ${saved.id}</button>`:"<p class='muted'>Aún no tienes pedidos.</p>"}</div></div></main><div class="footer">Punto Verde Express · Guadalupe y Chepén</div>`;renderMenu();}
function renderMenu(){const x=menus[current],el=document.getElementById("menu");if(current==="Sábado"){el.innerHTML=`<section class="card" style="border:2px solid var(--gold)"><h3>🔥 Especial de sábado</h3><p class="muted">Parrillas únicamente. Composición y precio se comunicarán semanalmente.</p><button class="btn gold" style="width:100%" onclick="openOrder(true)">Consultar / reservar</button></section>`;return}el.innerHTML=`<section class="card"><div class="menu-title"><div><h3>Menú del ${current}</h3><span class="muted">Casero & criollo</span></div><div class="price">S/12</div></div><div class="label">Entradas</div>${x.e.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}<div class="label">Segundos</div>${x.m.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}<button class="btn primary" style="width:100%;margin-top:13px" onclick="openOrder(false)">🛒 Hacer pedido</button></section>`}
function selectDay(d){current=d;customerUI()}
function openOrder(parrilla){const x=menus[current],m=document.createElement("div");m.className="modal show";m.id="orderModal";m.innerHTML=`<div class="sheet"><button class="close" onclick="closeOrder()">✕</button><h2>🛒 ${parrilla?"Reserva de parrilla":"Hacer pedido"}</h2><div class="field"><label>Nombre</label><input id="cname" placeholder="Tu nombre"></div>${parrilla?'<div class="status"><b>🔥 Parrilla del sábado</b><br><span class="muted">Precio y composición se comunicarán semanalmente.</span></div>':`<div class="field"><label>Entrada</label><select id="entry">${x.e.map(v=>`<option>${v}</option>`).join("")}</select></div><div class="field"><label>Segundo</label><select id="mainDish">${x.m.map(v=>`<option>${v}</option>`).join("")}</select></div>`}<div class="field"><label>Teléfono</label><input id="phone" placeholder="Opcional"></div><div class="field"><label>Modalidad</label><select id="delivery"><option value="delivery">🛵 Delivery</option><option value="pickup">🏪 Recojo</option></select></div><div class="field"><label>Zona</label><select id="zone"><option>Guadalupe</option><option>Chepén</option></select></div><div class="field" id="addrField"><label>Dirección</label><input id="address" placeholder="Calle, número o referencia"></div><div class="field"><label>Hora aproximada</label><input id="time" type="time"></div><div class="summary"><div class="sum"><span>Total estimado</span><span>S/<span id="total">12.00</span></span></div><small class="muted">S/12 menú referencial · Delivery S/3 Guadalupe / S/5 Chepén.</small></div><button class="btn primary" style="width:100%;margin-top:12px" onclick="submitOrder(${parrilla})">Confirmar pedido</button></div>`;document.body.appendChild(m);delivery.onchange=toggleAddress;zone.onchange=updateTotal;toggleAddress();updateTotal()}
function toggleAddress(){const d=delivery.value;addrField.style.display=d==="delivery"?"block":"none";updateTotal()}
function updateTotal(){const d=delivery.value,z=zone.value;total.textContent=(12+(d==="delivery"?(z==="Guadalupe"?3:5):0)).toFixed(2)}
function closeOrder(){document.getElementById("orderModal")?.remove()}
async function submitOrder(parrilla){const d=delivery.value,z=zone.value,address=(document.getElementById("address")?.value||"").trim();if(d==="delivery"&&!address){toast("Escribe la dirección");return}const body={customerName:cname.value||"Cliente",day:current,entry:document.getElementById("entry")?.value||"Parrilla del sábado",main:document.getElementById("mainDish")?.value||"Parrilla del sábado",phone:phone.value,zone:z,delivery:d,address,time:time.value,total:Number(total.textContent)};const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)}),data=await r.json();if(!data.ok){toast(data.error);return}localStorage.setItem("pvx_order",JSON.stringify({...data.order,customerToken:data.customerToken}));closeOrder();toast("Pedido enviado "+data.order.id);customerUI();loadTracking()}
async function loadTracking(){const o=JSON.parse(localStorage.getItem("pvx_order")||"null");if(!o?.id||!o.customerToken)return;const r=await fetch("/api/orders/"+o.id,{headers:{"X-Customer-Token":o.customerToken}});if(!r.ok){toast("No se pudo cargar tu pedido");return}const d=await r.json();renderTracking(d.order,d.driverLocation);customerSocket?.disconnect();customerSocket=io({auth:{customerToken:o.customerToken}});customerSocket.emit("join-order",{orderId:o.id,customerToken:o.customerToken});customerSocket.on("driver-location",loc=>{const latest=JSON.parse(localStorage.getItem("pvx_order")||"{}");renderTracking({...latest,status:latest.status||d.order.status},loc)});customerSocket.on("order-status",x=>{const n={...JSON.parse(localStorage.getItem("pvx_order")||"{}"),status:x.status};localStorage.setItem("pvx_order",JSON.stringify(n));loadTracking()})}
function renderTracking(order,loc){const idx=Math.max(0,steps.indexOf(order.status)),el=document.getElementById("tracking");if(!el)return;el.innerHTML=`<div class="status"><b>${statusNames[order.status]||order.status}</b><p class="muted" style="margin:7px 0">${order.entry} + ${order.main}<br>${order.delivery==="delivery"?"🛵 Delivery":"🏪 Recojo"} · ${order.zone}<br>${order.delivery==="delivery"?(order.address||""):""}<br>Total: <b>S/${Number(order.total).toFixed(2)}</b></p><div class="progress">${steps.slice(0,4).map((s,i)=>`<div class="step ${i<Math.min(idx,3)?"done":""} ${s===order.status?"current":""}">${statusNames[s]}</div>`).join("")}</div></div>${loc?'<div id="customerMap"></div><p class="muted" style="font-size:12px">📍 GPS del repartidor actualizado en tiempo real.</p>':'<p class="muted">🛵 El mapa aparecerá cuando el repartidor inicie el GPS y tenga tu pedido.</p>'}`;if(loc)setTimeout(()=>initCustomerMap(loc),30)}
function initCustomerMap(loc){const e=document.getElementById("customerMap");if(!e)return;if(customerMap)customerMap.remove();customerMap=L.map(e).setView([loc.lat,loc.lng],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(customerMap);customerMarker=L.marker([loc.lat,loc.lng]).addTo(customerMap).bindPopup("🛵 Repartidor").openPopup()}

async function adminUI(){const s=staffSession();if(!s||s.role!=="admin"){loginUI("admin");return}document.getElementById("app").innerHTML=`<header class="admin-head"><div class="wrap"><div class="topbar"><div><h2 style="margin:0">🧑‍💼 Panel de administración</h2><small>Sesión: ${s.user?.name||s.user?.username||"Administrador"}</small></div><button class="mode" onclick="logout()">🔒 Cerrar sesión</button></div></div></header><main class="admin-main"><div class="admin-toolbar"><div><h2 style="margin:0">📦 Pedidos recibidos</h2><p class="muted">Solo usuarios con rol administrador pueden acceder.</p></div><button class="btn gold" onclick="loadAdmin()">↻ Actualizar</button></div><div id="stats" class="stats"></div><div id="orders" class="orders"></div></main><div class="footer">Punto Verde Express · Administración privada</div>`;adminSocket?.disconnect();adminSocket=io({auth:{token:staffToken()}});adminSocket.on("connect_error",()=>{clearStaff();location.href="?modo=admin"});adminSocket.on("new-order",()=>{loadAdmin();toast("🔔 Nuevo pedido recibido")});adminSocket.on("order-updated",loadAdmin);adminSocket.on("driver-location",loadAdmin);loadAdmin()}
async function loadAdmin(){const r=await api("/api/orders");if(r.status===401||r.status===403){logout();return}const d=await r.json(),a=d.orders||[];document.getElementById("stats").innerHTML=`<div class="stat">Pedidos<b>${a.length}</b></div><div class="stat">Pendientes<b>${a.filter(o=>["received","accepted","preparing","ready"].includes(o.status)).length}</b></div><div class="stat">En camino<b>${a.filter(o=>o.status==="on_the_way").length}</b></div><div class="stat">Entregados<b>${a.filter(o=>o.status==="delivered").length}</b></div>`;document.getElementById("orders").innerHTML=a.length?a.map(o=>`<article class="order-item"><div class="order-top"><div><div class="code">${o.id}</div><small class="muted">${new Date(o.createdAt).toLocaleString()}</small></div><span class="badge">${statusNames[o.status]}</span></div><div class="order-grid"><div><b>Cliente</b><br>${o.customerName}<br>${o.phone||"Sin teléfono"}</div><div><b>Pedido</b><br>${o.entry} + ${o.main}<br>S/${Number(o.total).toFixed(2)}</div><div><b>Entrega</b><br>${o.delivery==="delivery"?"🛵 Delivery":"🏪 Recojo"} · ${o.zone}<br>${o.delivery==="delivery"?o.address:"Recoger en el local"}</div></div><div class="admin-actions">${o.delivery==="delivery"?`<select class="select-status" id="drv-${o.id}"></select>`:""}<select class="select-status" onchange="changeStatus('${o.id}',this.value)">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v}</option>`).join("")}</select>${o.delivery==="delivery"?`<button class="btn primary" onclick="watchOrder('${o.id}')">🗺️ Ver GPS</button>`:""}</div></article>`).join(""):`<div class="card"><h3>No hay pedidos todavía.</h3><p class="muted">Los nuevos pedidos aparecerán aquí.</p></div>`;if(a.length){const dr=await api("/api/drivers");const dd=await dr.json();a.filter(o=>o.delivery==="delivery").forEach(o=>{const sel=document.getElementById("drv-"+o.id);if(!sel)return;sel.innerHTML=`<option value="">Sin asignar</option>`+(dd.drivers||[]).map(x=>`<option value="${x.username}" ${o.driverId===x.username?"selected":""}>🛵 ${x.name}</option>`).join("");sel.onchange=()=>assignDriver(o.id,sel.value)})}}
async function assignDriver(id,driverId){const r=await api("/api/orders/"+id+"/assign",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({driverId})});if(r.ok)toast(driverId?"Repartidor asignado":"Asignación retirada");else toast("No se pudo asignar")}
async function changeStatus(id,status){const r=await api("/api/orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});if(r.ok)toast("Estado actualizado");else toast("No se pudo actualizar")}
async function watchOrder(id){const d=await (await api("/api/orders/"+id)).json(),m=document.createElement("div");m.className="modal show";m.id="watchModal";m.innerHTML=`<div class="sheet"><button class="close" onclick="document.getElementById('watchModal').remove()">✕</button><h2>🗺️ GPS del pedido ${id}</h2><div class="status"><b>${statusNames[d.order.status]}</b><br><span class="muted">${d.order.customerName} · ${d.order.zone}<br>${d.order.address||"Recojo"}</span></div><div id="adminMap"></div><p id="adminMapText" class="muted">Esperando ubicación del repartidor...</p></div>`;document.body.appendChild(m);const s=io({auth:{token:staffToken()}});s.emit("join-order",{orderId:id});s.on("driver-location",loc=>showAdminMap(loc));if(d.driverLocation)showAdminMap(d.driverLocation);m.querySelector(".close").addEventListener("click",()=>s.disconnect())}
function showAdminMap(loc){const e=document.getElementById("adminMap");if(!e)return;if(!adminMap){adminMap=L.map(e).setView([loc.lat,loc.lng],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(adminMap);adminMarker=L.marker([loc.lat,loc.lng]).addTo(adminMap)}else{adminMarker.setLatLng([loc.lat,loc.lng]);adminMap.setView([loc.lat,loc.lng])}document.getElementById("adminMapText").textContent=`📍 GPS recibido · ${new Date(loc.timestamp).toLocaleTimeString()}`}

async function driverUI(){const s=staffSession();if(!s||s.role!=="driver"){loginUI("driver");return}document.getElementById("app").innerHTML=`<header class="driver-head"><div class="wrap"><div class="topbar"><div><h2 style="margin:0">🛵 Panel del repartidor</h2><small>${s.user?.name||s.user?.username||"Repartidor"} · acceso privado</small></div><button class="mode" onclick="logout()">🔒 Cerrar sesión</button></div></div></header><main class="driver-main"><div class="card"><div class="driver-row"><div><h2 style="margin:0">Mis entregas asignadas</h2><p class="muted" style="margin:4px 0">Solo aparecen pedidos asignados a tu cuenta.</p></div><button class="btn gold" onclick="loadDriverOrders()">↻ Actualizar</button></div><div id="driverOrders" style="margin-top:12px"></div></div><div class="card" id="activeDelivery"><h3>📍 GPS</h3><p class="muted">Selecciona una entrega para activar el GPS.</p></div></main><div class="footer">Punto Verde Express · Repartidor privado</div>`;driverSocket?.disconnect();driverSocket=io({auth:{token:staffToken()}});driverSocket.on("connect_error",()=>{clearStaff();location.href="?modo=repartidor"});driverSocket.on("order-updated",loadDriverOrders);loadDriverOrders()}
async function loadDriverOrders(){const r=await api("/api/orders?status=active_delivery");if(!r.ok){logout();return}const d=await r.json(),a=d.orders||[],el=document.getElementById("driverOrders");if(!el)return;el.innerHTML=a.length?a.map(o=>`<div class="driver-card ${window.selectedDriverOrder===o.id?"selected":""}"><div class="driver-row"><div><b>${o.id}</b><br>${o.customerName} · ${o.zone}</div><span class="badge">${statusNames[o.status]}</span></div><p class="muted" style="font-size:13px">${o.address||"Dirección pendiente"}<br>${o.entry} + ${o.main}<br>Total S/${Number(o.total).toFixed(2)}</p><div class="admin-actions"><button class="btn primary" onclick="selectDriverOrder('${o.id}')">📍 Seleccionar y activar GPS</button><button class="btn gold" onclick="driverUpdateStatus('${o.id}','on_the_way')">🛵 En camino</button></div></div>`).join(""):`<div class="driver-card"><b>No hay entregas activas.</b><p class="muted">Cuando administración te asigne un pedido, aparecerá aquí.</p></div>`}
function selectDriverOrder(id){window.selectedDriverOrder=id;driverUI();setTimeout(()=>startGPS(id),100)}
function startGPS(orderId){if(!navigator.geolocation){toast("Este navegador no tiene GPS");return}const box=document.getElementById("activeDelivery");if(box)box.innerHTML=`<div class="driver-row"><div><h3 style="margin:0">📍 Entrega ${orderId}</h3><p class="muted">Tu ubicación se envía al cliente y administración.</p></div><span id="gpsLabel" class="gps off">Iniciando...</span></div><div id="driverMap"></div><p id="gpsDetail" class="muted" style="font-size:12px">Esperando permiso de ubicación…</p><button class="btn gold" style="width:100%;margin-top:10px" onclick="stopGPS()">⏹ Detener GPS</button>`;driverSocket?.emit("join-order",{orderId});if(driverWatch!==null)navigator.geolocation.clearWatch(driverWatch);driverWatch=navigator.geolocation.watchPosition(pos=>{const loc={orderId,lat:pos.coords.latitude,lng:pos.coords.longitude,accuracy:pos.coords.accuracy,timestamp:new Date().toISOString()};document.getElementById("gpsLabel").textContent="GPS ACTIVO";document.getElementById("gpsLabel").className="gps on";document.getElementById("gpsDetail").textContent=`Ubicación enviada · precisión aprox. ${Math.round(pos.coords.accuracy||0)} m · ${new Date().toLocaleTimeString()}`;driverSocket.emit("driver-location",loc);updateDriverMap(loc)},err=>{const msg=err.code===1?"Permiso de ubicación denegado. Activa Ubicación y permite el acceso en el navegador.":err.code===2?"No se pudo obtener la ubicación.":"Tiempo agotado buscando ubicación.";const l=document.getElementById("gpsLabel");if(l){l.textContent="GPS ERROR";l.className="gps off"}toast(msg)},{enableHighAccuracy:true,maximumAge:3000,timeout:15000});driverUpdateStatus(orderId,"picked_up");toast("GPS activado para "+orderId)}
function stopGPS(){if(driverWatch!==null){navigator.geolocation.clearWatch(driverWatch);driverWatch=null}const l=document.getElementById("gpsLabel");if(l){l.textContent="GPS DETENIDO";l.className="gps off"}toast("GPS detenido")}
function updateDriverMap(loc){if(!driverMap){driverMap=L.map("driverMap").setView([loc.lat,loc.lng],16);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(driverMap);driverMarker=L.marker([loc.lat,loc.lng]).addTo(driverMap).bindPopup("Tu ubicación")}else{driverMarker.setLatLng([loc.lat,loc.lng]);driverMap.setView([loc.lat,loc.lng])}}
async function driverUpdateStatus(id,status){if(driverSocket)driverSocket.emit("driver-status",{orderId:id,status});else await api("/api/orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});toast("Estado: "+statusNames[status])}

const mode=new URLSearchParams(location.search).get("modo");
if(mode==="admin")adminUI();else if(mode==="repartidor")driverUI();else customerUI();
</script></body>
</html>
