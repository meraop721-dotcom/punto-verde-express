
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b5b36">
<title>Punto Verde Express</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{--g:#0b5b36;--g2:#14764a;--gold:#f0a52b;--cream:#f7f5ee;--ink:#173b29;--muted:#69766f;--line:#e2e8e1;--white:#fff;--danger:#b84932;--shadow:0 10px 28px rgba(19,57,39,.10)}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}button,input,select{font:inherit}.wrap{max-width:1040px;margin:auto}
.top{background:linear-gradient(135deg,#073e25,#0b5b36 70%,#167448);color:#fff;padding:18px;border-radius:0 0 28px 28px}.topbar{display:flex;justify-content:space-between;gap:10px;align-items:center}.brand{display:flex;align-items:center;gap:10px}.mark{width:46px;height:46px;border-radius:15px;background:var(--gold);display:grid;place-items:center;font-size:24px}.brand h1{margin:0;font-size:21px}.brand span{font-size:12px;color:#d7efdf}.mode{border:1px solid #ffffff33;background:#ffffff14;color:#fff;padding:10px 12px;border-radius:13px;font-weight:800}
main{padding:18px}.days{display:flex;gap:8px;overflow:auto;margin:15px 0}.day{background:#fff;border:1px solid var(--line);border-radius:13px;padding:10px 14px;font-weight:800;white-space:nowrap}.day.active{background:var(--g);border-color:var(--g);color:#fff}
.card{background:#fff;border:1px solid var(--line);border-radius:21px;padding:18px;box-shadow:var(--shadow);margin:14px 0}.menu-title{display:flex;justify-content:space-between;gap:10px}.price{background:#edf7ef;color:var(--g);border-radius:10px;padding:7px 10px;font-weight:900}.label{margin-top:16px;color:var(--muted);font-size:12px;font-weight:900;text-transform:uppercase;letter-spacing:.06em}.food{display:flex;justify-content:space-between;padding:11px 0;border-bottom:1px solid var(--line)}.food:last-child{border:0}.muted{color:var(--muted)}.btn{border:0;border-radius:13px;padding:13px 14px;font-weight:900;cursor:pointer}.primary{background:var(--g);color:#fff}.gold{background:var(--gold);color:var(--ink)}.danger{background:#fff0ed;color:var(--danger)}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:1000;padding:15px;align-items:end}.modal.show{display:flex}.sheet{background:#fff;border-radius:24px 24px 0 0;width:100%;max-width:720px;margin:auto;padding:20px;max-height:92vh;overflow:auto}.close{float:right;border:0;border-radius:50%;width:36px;height:36px}.field{margin:11px 0}.field label{display:block;font-size:12px;font-weight:800;color:var(--muted);margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #ccd6cf;border-radius:12px}.summary{background:#f5f8f5;border-radius:15px;padding:14px}.sum{display:flex;justify-content:space-between;font-weight:900}
#customerMap,#adminMap{height:340px;border-radius:17px;margin-top:12px}.status{background:#eef7f0;border:1px solid #d7e9dc;padding:13px;border-radius:15px}.progress{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:11px}.step{background:#edf0ed;border-radius:10px;padding:8px 5px;font-size:10px;text-align:center;font-weight:800}.step.done{background:#cfe8d6;color:var(--g)}.step.current{background:var(--g);color:#fff}
.admin-head{background:var(--g);color:#fff;padding:18px}.admin-main{padding:18px}.admin-toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:14px 0}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.stat b{display:block;font-size:25px}.orders{display:grid;gap:12px}.order-item{background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;box-shadow:0 5px 18px rgba(19,57,39,.07)}.order-top{display:flex;justify-content:space-between;gap:10px}.code{font-weight:950}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:11px;font-weight:900;background:#edf7ef;color:var(--g)}.order-grid{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:8px;color:var(--muted);font-size:13px;margin:10px 0}.select-status{padding:10px;border:1px solid var(--line);border-radius:10px}.admin-actions{display:flex;gap:8px;flex-wrap:wrap}
.toast{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);background:#173b29;color:#fff;padding:11px 15px;border-radius:12px;display:none;z-index:2000}.toast.show{display:block}.footer{text-align:center;color:var(--muted);padding:30px 10px;font-size:12px}
@media(max-width:700px){.stats{grid-template-columns:1fr 1fr}.order-grid{grid-template-columns:1fr}.progress{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="app"></div><div id="toast" class="toast"></div>
<script src="/socket.io/socket.io.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const menus={
"Lunes":{e:["Sopa de pollo","Papa a la huancaína","Causa de pollo"],m:["Arroz con pollo","Ají de gallina","Tallarines rojos con pollo"]},
"Martes":{e:["Aguadito de pollo","Papa rellena","Ensalada rusa"],m:["Lomo saltado","Milanesa de pollo","Cau cau"]},
"Miércoles":{e:["Sopa de verduras","Ocopa","Tamal criollo"],m:["Pescado frito","Arroz chaufa de pollo","Seco de pollo"]},
"Jueves":{e:["Caldo de gallina","Causa de pollo","Papa a la huancaína"],m:["Arroz con pato","Pollo al horno","Tallarines verdes con pollo"]},
"Viernes":{e:["Chilcano de pescado","Causa de atún","Papa rellena"],m:["Seco de cabrito","Lomo saltado","Pescado sudado"]},
"Sábado":{e:[],m:[]}
};
const statusNames={received:"Recibido",accepted:"Aceptado",preparing:"Preparando",ready:"Listo",picked_up:"Recogido",on_the_way:"En camino",delivered:"Entregado",cancelled:"Cancelado"};
const statusOrder=["received","accepted","preparing","ready","picked_up","on_the_way","delivered"];
let current=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado"][new Date().getDay()-1]||"Lunes";
let customerSocket,driverSocket,adminSocket,driverWatch=null,customerMap=null,driverMap=null,marker=null;

function toast(s){const t=document.getElementById("toast");t.textContent=s;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2100)}
function customerUI(){
 const saved=JSON.parse(localStorage.getItem("pvx_order")||"null");
 document.getElementById("app").innerHTML=`<header class="top"><div class="wrap"><div class="topbar"><div class="brand"><div class="mark">🍽️</div><div><h1>Punto Verde Express</h1><span>Menús & Parrillas</span></div></div><button class="mode" onclick="location.href='?modo=admin'">🧑‍💼 Administrador</button></div><div style="margin-top:20px"><b style="font-size:28px">Tu menú de la semana,<br>tu parrilla del sábado.</b><p style="margin-bottom:0;color:#d7efdf">Guadalupe · Chepén</p></div></div></header>
 <main class="wrap"><div class="days">${Object.keys(menus).map(d=>`<button class="day ${d===current?"active":""}" onclick="selectDay('${d}')">${d}</button>`).join("")}</div><div id="menu"></div>
 <div class="card" id="tracking"><h3>📦 Mis pedidos</h3>${saved?`<button class="btn primary" onclick="loadTracking()">Ver pedido ${saved.id}</button>`:"<p class='muted'>Aún no tienes pedidos.</p>"}</div>
 </main><div class="footer">Punto Verde Express · Menús & Parrillas</div>`;
 renderMenu();
}
function renderMenu(){
 const x=menus[current], el=document.getElementById("menu");
 if(current==="Sábado"){el.innerHTML=`<section class="card" style="border:2px solid var(--gold)"><h3>🔥 Especial de sábado</h3><p class="muted">Parrillas únicamente. Composición y precio se comunicarán semanalmente.</p><button class="btn gold" style="width:100%" onclick="openOrder(true)">Consultar / reservar</button></section>`;return}
 el.innerHTML=`<section class="card"><div class="menu-title"><div><h3>Menú del ${current}</h3><span class="muted">Casero & criollo</span></div><div class="price">S/12</div></div><div class="label">Entradas</div>${x.e.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}<div class="label">Segundos</div>${x.m.map(v=>`<div class="food"><b>${v}</b><span>✓</span></div>`).join("")}<button class="btn primary" style="width:100%;margin-top:13px" onclick="openOrder(false)">🛒 Hacer pedido</button></section>`;
}
function selectDay(d){current=d;customerUI()}
function openOrder(parrilla){
 const x=menus[current];const modal=document.createElement("div");modal.className="modal show";modal.id="orderModal";
 modal.innerHTML=`<div class="sheet"><button class="close" onclick="closeOrder()">✕</button><h2>🛒 ${parrilla?"Reserva de parrilla":"Hacer pedido"}</h2>
 <div class="field"><label>Nombre</label><input id="cname" placeholder="Tu nombre"></div>
 ${parrilla?'<div class="status"><b>🔥 Parrilla del sábado</b><br><span class="muted">Precio y composición se comunicarán semanalmente.</span></div>':`<div class="field"><label>Entrada</label><select id="entry">${x.e.map(v=>`<option>${v}</option>`).join("")}</select></div><div class="field"><label>Segundo</label><select id="mainDish">${x.m.map(v=>`<option>${v}</option>`).join("")}</select></div>`}
 <div class="field"><label>Teléfono</label><input id="phone" placeholder="Opcional"></div>
 <div class="field"><label>Modalidad</label><select id="delivery"><option value="delivery">🛵 Delivery</option><option value="pickup">🏪 Recojo</option></select></div>
 <div class="field"><label>Zona</label><select id="zone"><option>Guadalupe</option><option>Chepén</option></select></div>
 <div class="field" id="addrField"><label>Dirección de entrega</label><input id="address" placeholder="Calle, número o referencia"></div>
 <div class="field"><label>Hora aproximada</label><input id="time" type="time"></div>
 <div class="summary"><div class="sum"><span>Total estimado</span><span>S/<span id="total">12.00</span></span></div><small class="muted">Menú S/12 referencial · Delivery S/3 Guadalupe / S/5 Chepén.</small></div>
 <button class="btn primary" style="width:100%;margin-top:12px" onclick="submitOrder(${parrilla})">Confirmar pedido</button></div>`;
 document.body.appendChild(modal);document.getElementById("delivery").onchange=toggleAddress;document.getElementById("zone").onchange=updateTotal;toggleAddress();updateTotal();
}
function toggleAddress(){const d=document.getElementById("delivery").value;document.getElementById("addrField").style.display=d==="delivery"?"block":"none";updateTotal()}
function updateTotal(){const d=document.getElementById("delivery").value,z=document.getElementById("zone").value;document.getElementById("total").textContent=(12+(d==="delivery"?(z==="Guadalupe"?3:5):0)).toFixed(2)}
function closeOrder(){document.getElementById("orderModal")?.remove()}
async function submitOrder(parrilla){
 const delivery=document.getElementById("delivery").value,address=(document.getElementById("address")?.value||"").trim();
 if(delivery==="delivery"&&!address){toast("Escribe la dirección de entrega");return}
 const z=document.getElementById("zone").value,total=Number(document.getElementById("total").textContent);
 const body={customerName:document.getElementById("cname").value||"Cliente",day:current,entry:document.getElementById("entry")?.value||"Parrilla del sábado",main:document.getElementById("mainDish")?.value||"Parrilla del sábado",phone:document.getElementById("phone").value,zone:z,delivery,address,time:document.getElementById("time").value,total};
 const r=await fetch("/api/orders",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});const data=await r.json();if(!data.ok){toast(data.error||"No se pudo crear el pedido");return}
 localStorage.setItem("pvx_order",JSON.stringify(data.order));closeOrder();toast("Pedido enviado: "+data.order.id);customerUI();loadTracking();
}
async function loadTracking(){
 const o=JSON.parse(localStorage.getItem("pvx_order")||"null");if(!o)return;const r=await fetch("/api/orders/"+o.id);if(!r.ok)return;const d=await r.json();renderTracking(d.order,d.driverLocation);
 customerSocket ||= io();customerSocket.emit("join-order",{orderId:o.id});customerSocket.off("driver-location");customerSocket.off("order-status");
 customerSocket.on("driver-location",loc=>renderTracking({...o,status:(JSON.parse(localStorage.getItem("pvx_order")||"{}").status||o.status)},loc));
 customerSocket.on("order-status",x=>{const n={...o,status:x.status};localStorage.setItem("pvx_order",JSON.stringify(n));renderTracking(n)});
}
function renderTracking(order,loc){
 const el=document.getElementById("tracking");if(!el)return;const idx=statusOrder.indexOf(order.status);
 el.innerHTML=`<h3>📦 Pedido ${order.id}</h3><div class="status"><b>${statusNames[order.status]||order.status}</b><p class="muted" style="margin:7px 0">${order.entry} + ${order.main}<br>${order.delivery==="delivery"?"🛵 Delivery":"🏪 Recojo"} · ${order.zone}<br>${order.delivery==="delivery"?order.address+"<br>":""}Total: <b>S/${Number(order.total).toFixed(2)}</b></p><div class="progress">${statusOrder.slice(0,4).map((s,i)=>`<div class="step ${i<Math.min(idx,3)?"done":""} ${s===order.status?"current":""}">${statusNames[s]}</div>`).join("")}</div></div>
 ${loc?'<div id="customerMap"></div><p class="muted" style="font-size:12px">📍 Ubicación del repartidor actualizada en tiempo real.</p>':'<p class="muted">🛵 El mapa aparecerá cuando el repartidor inicie la entrega.</p>'}`;
 if(loc)setTimeout(()=>initCustomerMap(loc),40);
}
function initCustomerMap(loc){
 const el=document.getElementById("customerMap");if(!el)return;if(customerMap)customerMap.remove();customerMap=L.map("customerMap").setView([loc.lat,loc.lng],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(customerMap);L.marker([loc.lat,loc.lng]).addTo(customerMap).bindPopup("🛵 Repartidor").openPopup();
}
function adminUI(){
 document.getElementById("app").innerHTML=`<header class="admin-head"><div class="wrap"><div class="topbar"><div><h2 style="margin:0">🧑‍💼 Punto Verde Express</h2><small>Panel de pedidos</small></div><button class="mode" onclick="location.href='/'">👤 Vista cliente</button></div></div></header>
 <main class="admin-main wrap"><div class="admin-toolbar"><div><h2 style="margin:0">📦 Pedidos recibidos</h2><p class="muted" style="margin:4px 0">Aquí llegan los pedidos que hacen los clientes.</p></div><button class="btn gold" onclick="loadAdminOrders()">↻ Actualizar</button></div>
 <div class="stats" id="stats"></div><div id="orders" class="orders"></div></main>`;
 adminSocket ||= io();adminSocket.emit("join-admin");adminSocket.on("new-order",()=>{loadAdminOrders();toast("🔔 Nuevo pedido recibido")});adminSocket.on("order-updated",()=>loadAdminOrders());adminSocket.on("driver-location",()=>{});
 loadAdminOrders();
}
async function loadAdminOrders(){
 const r=await fetch("/api/orders");const d=await r.json();const arr=d.orders||[];const counts={total:arr.length,pending:arr.filter(o=>["received","accepted","preparing","ready"].includes(o.status)).length,route:arr.filter(o=>o.status==="on_the_way").length,done:arr.filter(o=>o.status==="delivered").length};
 document.getElementById("stats").innerHTML=`<div class="stat"><span>Total</span><b>${counts.total}</b></div><div class="stat"><span>En preparación</span><b>${counts.pending}</b></div><div class="stat"><span>En camino</span><b>${counts.route}</b></div><div class="stat"><span>Entregados</span><b>${counts.done}</b></div>`;
 document.getElementById("orders").innerHTML=arr.length?arr.map(o=>orderCard(o)).join(""):`<div class="card"><h3>No hay pedidos todavía.</h3><p class="muted">Cuando un cliente confirme un pedido, aparecerá aquí automáticamente.</p></div>`;
}
function orderCard(o){
 return `<article class="order-item"><div class="order-top"><div><div class="code">${o.id}</div><small class="muted">${new Date(o.createdAt).toLocaleString()}</small></div><span class="badge">${statusNames[o.status]}</span></div><div class="order-grid"><div><b>Cliente</b><br>${o.customerName}<br>${o.phone||"Sin teléfono"}</div><div><b>Pedido</b><br>${o.entry} + ${o.main}<br>Total: S/${Number(o.total).toFixed(2)}</div><div><b>Entrega</b><br>${o.delivery==="delivery"?"🛵 Delivery":"🏪 Recojo"} · ${o.zone}<br>${o.delivery==="delivery"?o.address:"Recoger en el local"}</div></div>
 <div class="admin-actions"><select class="select-status" onchange="changeStatus('${o.id}',this.value)">${Object.entries(statusNames).map(([k,v])=>`<option value="${k}" ${k===o.status?"selected":""}>${v}</option>`).join("")}</select><button class="btn primary" onclick="watchOrder('${o.id}')">🗺️ Ver seguimiento</button></div></article>`;
}
async function changeStatus(id,status){const r=await fetch("/api/orders/"+id+"/status",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({status})});if(r.ok)toast("Estado actualizado")}
async function watchOrder(id){const r=await fetch("/api/orders/"+id);const d=await r.json();const modal=document.createElement("div");modal.className="modal show";modal.id="watchModal";modal.innerHTML=`<div class="sheet"><button class="close" onclick="document.getElementById('watchModal').remove()">✕</button><h2>🗺️ Seguimiento ${id}</h2><div class="status"><b>${statusNames[d.order.status]}</b><br><span class="muted">${d.order.customerName} · ${d.order.zone}</span></div><div id="adminMap"></div><p id="adminMapText" class="muted">Esperando ubicación del repartidor...</p></div>`;document.body.appendChild(modal);adminMap ||= null;if(d.driverLocation)showAdminMap(d.driverLocation);const s=io();s.emit("join-order",{orderId:id});s.on("driver-location",loc=>{if(document.getElementById("watchModal"))showAdminMap(loc)});}
function showAdminMap(loc){const mEl=document.getElementById("adminMap");if(!mEl)return;if(!adminMap){adminMap=L.map("adminMap").setView([loc.lat,loc.lng],15);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{attribution:"© OpenStreetMap"}).addTo(adminMap);marker=L.marker([loc.lat,loc.lng]).addTo(adminMap)}else{marker.setLatLng([loc.lat,loc.lng]);adminMap.setView([loc.lat,loc.lng])}document.getElementById("adminMapText").textContent=`📍 GPS recibido · precisión aproximada ${loc.accuracy?Math.round(loc.accuracy):"—"} m · ${new Date(loc.timestamp).toLocaleTimeString()}`}
function goDriver(){location.href='?modo=repartidor'}
function driverUI(){/* preservado en el mismo proyecto: se añade en una actualización específica */ customerUI();toast("Modo repartidor disponible en la versión GPS v4; usa el panel de repartidor del proyecto anterior.")}

if(new URLSearchParams(location.search).get("modo")==="admin")adminUI();else customerUI();
</script>
</body>
</html>
