<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Punto Verde Express</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><script src="/socket.io/socket.io.js"></script><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><style>body{margin:0;font-family:system-ui;background:#f4f7f4;color:#183126}.top{background:#123d2b;color:#fff;padding:20px}.wrap{max-width:1100px;margin:auto;padding:18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:12px;padding:11px 15px;background:#159447;color:#fff;font-weight:700;cursor:pointer}.light{background:#e7f3eb;color:#123d2b}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #0001}.products{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.product{border:1px solid #e2e9e4;border-radius:15px;padding:14px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{display:inline-block;padding:6px 10px;border-radius:20px;background:#e7f3eb}.input{width:100%;box-sizing:border-box;padding:12px;border:1px solid #d8e0da;border-radius:11px;margin:5px 0}#map{height:340px;border-radius:15px}.hidden{display:none}.muted{color:#65756c;font-size:13px}.order{border:1px solid #e0e8e2;padding:12px;border-radius:12px;margin:8px 0}@media(max-width:760px){.grid,.products{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="wrap"><h1>🥗 Punto Verde Express</h1><p>Delivery local en Guadalupe y Chepén</p><div class="tabs"><button class="btn" onclick="role('client')">Cliente</button><button class="btn light" onclick="role('admin')">Administrador</button><button class="btn light" onclick="role('driver')">Repartidor</button></div></div></header><main class="wrap"><section id="client"><div class="grid"><div><div class="card"><h2>¿Qué quieres pedir?</h2><input class="input" id="search" placeholder="Buscar comida..."></div><div id="products" class="products"></div></div><aside><div class="card"><h2>🛒 Carrito</h2><div id="cart">Agrega productos</div><div class="row"><b>Total</b><b id="total">S/ 0.00</b></div><input class="input" id="name" placeholder="Tu nombre"><input class="input" id="address" placeholder="Dirección (ej. Guadalupe, Jr. ...)"><button class="btn" style="width:100%" onclick="checkout()">Confirmar pedido</button></div><div class="card"><h2>📦 Seguimiento</h2><div id="tracking">Aún no tienes pedidos.</div><div id="map" class="hidden"></div></div></aside></div></section><section id="admin" class="hidden"><div class="card"><h2>🧑‍💼 Panel de pedidos</h2><div id="orders"></div></div><div class="card"><h2>🛵 Repartidores conectados</h2><div id="drivers"></div></div></section><section id="driver" class="hidden"><div class="card"><h2>🛵 Panel del repartidor</h2><input class="input" id="driverName" placeholder="Nombre del repartidor"><select class="input" id="driverZone"><option>Guadalupe</option><option>Chepén</option></select><button class="btn" onclick="startDriver()">Conectarme y compartir GPS</button><p id="gps" class="muted">GPS desconectado.</p></div><div class="card"><h2>Pedidos disponibles</h2><div id="driverOrders"></div></div><div class="card"><div id="driverMap" style="height:340px;border-radius:15px"></div></div></section></main><script>
const products=[['Hamburguesa Clásica',12],['Hamburguesa Especial',16],['Salchipapa',13],['Pollo Broaster',15],['Combo Familiar',32],['Gaseosa',4]];let cart=[],current=null,orders=[],driverWatch=null;const socket=io();let map,marker,driverMap,driverMarker;
const $=id=>document.getElementById(id);function role(r){['client','admin','driver'].forEach(x=>$(x).classList.toggle('hidden',x!==r));if(r==='admin')renderAdmin();if(r==='driver')renderDriver();}
function render(){const q=($('search').value||'').toLowerCase();$('products').innerHTML=products.filter(p=>p[0].toLowerCase().includes(q)).map((p,i)=>`<div class="product"><h3>${p[0]}</h3><div class="row"><b>S/ ${p[1].toFixed(2)}</b><button class="btn" onclick="add(${i})">Agregar</button></div></div>`).join('');renderCart()}function add(i){let p=products[i],x=cart.find(x=>x[0]===p[0]);x?x[2]++:cart.push([p[0],p[1],1]);renderCart()}function renderCart(){$('cart').innerHTML=cart.length?cart.map((x,i)=>`<div class="row"><span>${x[0]} × ${x[2]}</span><button class="btn light" onclick="cart.splice(${i},1);renderCart()">−</button></div>`).join(''):'Agrega productos';$('total').textContent='S/ '+cart.reduce((a,x)=>a+x[1]*x[2],0).toFixed(2)}
async function checkout(){if(!cart.length)return alert('Agrega productos.');if(!/guadalupe|chep[eé]n/i.test($('address').value))return alert('Por ahora entregamos solo en Guadalupe y Chepén. Escribe tu ciudad en la dirección.');const total=cart.reduce((a,x)=>a+x[1]*x[2],0);const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({customer:$('name').value,address:$('address').value,items:cart,total})});current=await r.json();cart=[];renderCart();show(current)}
function show(o){current=o;$('tracking').innerHTML=`<span class="pill">Pedido #${o.id}</span><h3>${o.status}</h3><p>${o.zone} • ${o.address}</p><p class="muted">La ubicación del repartidor se actualiza en tiempo real cuando comparte GPS.</p>`;$('map').classList.remove('hidden');if(!map){map=L.map('map').setView([-7.25,-79.46],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(map)}if(o.lat&&o.lng){if(!marker)marker=L.marker([o.lat,o.lng]).addTo(map);else marker.setLatLng([o.lat,o.lng]);map.setView([o.lat,o.lng],14)}}
function renderAdmin(){$('orders').innerHTML=orders.map(o=>`<div class="order"><b>#${o.id} — ${o.zone}</b><br>${o.customer} — ${o.address}<br><span class="pill">${o.status}</span> <button class="btn light" onclick="setStatus(${o.id},'PREPARANDO')">Preparando</button> <button class="btn" onclick="setStatus(${o.id},'LISTO')">Listo</button></div>`).join('')||'No hay pedidos.'}async function setStatus(id,status){await fetch('/api/orders/'+id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})})}
function renderDrivers(ds=[]){$('drivers').innerHTML=ds.map(d=>`<div class="order">🛵 ${d.name} — ${d.zone} ${d.lat?`• GPS activo`:''}</div>`).join('')||'Ninguno conectado.'}
function renderDriver(){if(!driverMap){driverMap=L.map('driverMap').setView([-7.25,-79.46],12);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'© OpenStreetMap'}).addTo(driverMap)}}function startDriver(){if(!navigator.geolocation)return alert('Este dispositivo no permite GPS.');socket.emit('driver:join',{name:$('driverName').value||'Repartidor',zone:$('driverZone').value});driverWatch=navigator.geolocation.watchPosition(pos=>{const p={lat:pos.coords.latitude,lng:pos.coords.longitude,zone:$('driverZone').value};$('gps').textContent=`GPS activo: ${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}`;if(!driverMarker)driverMarker=L.marker([p.lat,p.lng]).addTo(driverMap);else driverMarker.setLatLng([p.lat,p.lng]);driverMap.setView([p.lat,p.lng],15);const o=orders.find(x=>x.status==='LISTO'&&x.zone===p.zone);if(o)socket.emit('driver:location',{...p,orderId:o.id})},e=>$('gps').textContent='No se pudo obtener el GPS: '+e.message,{enableHighAccuracy:true,maximumAge:3000,timeout:10000})}
function renderDriverOrders(){$('driverOrders').innerHTML=orders.filter(o=>o.status!=='ENTREGADO').map(o=>`<div class="order"><b>#${o.id}</b> — ${o.zone}<br>${o.address}<br><span class="pill">${o.status}</span></div>`).join('')||'No hay pedidos.'}
socket.on('orders:init',x=>{orders=x;renderAdmin();renderDriverOrders()});socket.on('order:update',o=>{const i=orders.findIndex(x=>x.id===o.id);i>=0?orders[i]=o:orders.unshift(o);renderAdmin();renderDriverOrders();if(current&&current.id===o.id)show(o)});socket.on('drivers:init',renderDrivers);socket.on('drivers:update',renderDrivers);socket.on('driver:location',p=>{if(current&&current.id===p.orderId)show({...current,...p,status:'EN CAMINO'})});$('search').oninput=render;render();
</script></body></html>
